build:
  docker:
    worker: Dockerfile
  config:
    PYTHONUNBUFFERED: 1

run:
  worker: python3 main.py

env:
  API_ID: ${API_ID}
  API_HASH: ${API_HASH}
  BOT_TOKEN: ${BOT_TOKEN}
  OWNER: ${OWNER}
  CREDIT: ${CREDIT}
  PROXY_SCHEME: ${PROXY_SCHEME:-http}
  PROXY_HOST: ${PROXY_HOST:-203.115.123.163}
  PROXY_PORT: ${PROXY_PORT:-80}
  PROXY_USER: ${PROXY_USER:-admin}
  PROXY_PASS: ${PROXY_PASS:-admin}

  # for heroku deployment...add this bulidpack.  
#  https://github.com/heroku/heroku-buildpack-activestorage-preview

